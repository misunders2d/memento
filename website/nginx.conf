worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # Do not put query strings, including accidental OAuth codes, in access logs.
    log_format public_site '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout public_site;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        charset utf-8;

        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = / {
            try_files /index.html =404;
        }
        location = /index.html {
            return 308 /;
        }
        location = /privacy {
            return 308 /privacy/;
        }
        location = /privacy/ {
            try_files /privacy/index.html =404;
        }
        location = /terms {
            return 308 /terms/;
        }
        location = /terms/ {
            try_files /terms/index.html =404;
        }
        location /assets/ {
            try_files $uri =404;
        }

        # This hostname is not an API gateway. Never proxy to the memory service.
        location / {
            return 404;
        }
    }
}
