[package]
name="memento-server"
version="0.1.0"
edition.workspace=true
rust-version.workspace=true
publish=false
[dependencies]
memento-core={path="../core"}
memento-domain={path="../domain"}
memento-ann={path="../ann"}
memento-embedding={path="../model"}
memento-media={path="../media"}
memento-maintenance={path="../maintenance",default-features=false}
memento-owner={path="../owner",default-features=false}
regex.workspace=true
flate2.workspace=true
ureq.workspace=true
libc.workspace=true
chrono.workspace=true
axum.workspace=true
tokio.workspace=true
serde.workspace=true
serde_json.workspace=true
futures-util.workspace=true
base64.workspace=true
sha2.workspace=true
rusqlite.workspace=true
ort={version="=2.0.0-rc.13",default-features=false,features=["std","load-dynamic","api-18"]}
tokenizers={version="=0.23.2",default-features=false,features=["fancy-regex"]}
[dev-dependencies]
tempfile.workspace=true
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name="memento"
path="src/main.rs"
