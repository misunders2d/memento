[package]
name="memento-maintenance"
version="0.1.0"
edition.workspace=true
rust-version.workspace=true
publish=false
[features]
default=[]
legacy-import=["dep:sqlite-vec"]
[dependencies]
memento-core={path="../core"}
rusqlite.workspace=true
serde.workspace=true
serde_json.workspace=true
sha2.workspace=true
uuid.workspace=true
tar.workspace=true
sqlite-vec={workspace=true,optional=true}
[dev-dependencies]
tempfile.workspace=true
flate2.workspace=true

[[bin]]
name="memento-import"
path="src/bin/import.rs"
required-features=["legacy-import"]
