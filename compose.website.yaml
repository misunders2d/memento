name: memento-public
services:
  website:
    build:
      context: ./website
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:8080"
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
