[workspace]
members = ["crates/core", "crates/domain", "crates/ann", "crates/maintenance"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled", "functions", "backup", "blob"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "arbitrary_precision"] }
chrono = { version = "=0.4.45", features = ["serde"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
sha2 = "=0.11.1"
regex = "=1.13.1"
flate2 = "=1.1.10"
libc = "=0.2.191"
tempfile = "=3.27.0"
qdrant-edge = "=0.9.0"
sqlite-vec = "=0.1.9"
tar = { version = "=0.4.46", default-features = false }

[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
[profile.release]
debug = 0
